# ─────────────────────────────────────────────────────────────────────────────
# IndusCost homologação — superfície pública da Satisfação
#
# Destino no servidor-01:
#   /etc/systemd/system/induscost-homolog.service.d/98-satisfaction-public.conf
#
# Aplicar somente DEPOIS que o deploy da main com o módulo estiver no ar.
# Depois de criar:  systemctl daemon-reload && systemctl restart induscost-homolog
#
# NÃO contém segredo. Nenhuma chave do Turnstile é definida aqui — em
# homologação o Turnstile fica explicitamente desabilitado (ver abaixo).
# ─────────────────────────────────────────────────────────────────────────────

[Service]

# Hostname público. É por ele que o Public Host Guard do Node reconhece a
# superfície e passa a responder 404 para tudo que não seja a allowlist.
# Enquanto esta variável estiver vazia, o guard fica inativo — é o que mantém
# o app administrativo intocado.
Environment="SATISFACTION_PUBLIC_HOSTS=satisfacao-homolog.grupolazarios.com.br"

# Base usada para montar o link enviado ao cliente. O token vai no fragmento
# (#TOKEN), que o navegador não transmite no request.
Environment="SATISFACTION_PUBLIC_BASE_URL=https://satisfacao-homolog.grupolazarios.com.br"

# Header dedicado que o Nginx sobrescreve em toda requisição da superfície
# pública. Segunda via de identificação, além do Host. Headers genéricos
# (X-Forwarded-Host, X-Real-IP) NUNCA participam desta decisão.
Environment="SATISFACTION_PUBLIC_SURFACE_HEADER=x-induscost-satisfaction-public"

# Há um proxy próprio (Nginx local) na frente, então o rate limiter pode
# confiar no X-Forwarded-For para identificar o cliente real.
Environment="SATISFACTION_TRUST_PROXY=1"

# TURNSTILE EXPLICITAMENTE DESABILITADO EM HOMOLOGAÇÃO.
# Motivo: o serviço tem egress bloqueado por systemd (IPAddressDeny=any) e não
# vamos abrir Internet geral só para alcançar o siteverify da Cloudflare.
# Consequência aceita: o formulário de homologação não tem proteção anti-bot.
# Em PRODUÇÃO isto é obrigatório e vira SATISFACTION_TURNSTILE_SECRET_KEY +
# SITE_KEY, com egress mínimo liberado para
# https://challenges.cloudflare.com/turnstile/v0/siteverify.
# NÃO defina secret falso aqui: com secret presente o modo vira obrigatório e
# todo submit passaria a falhar.
Environment="SATISFACTION_TURNSTILE_MODE=disabled"

# O hostname público é HTTPS na borda do Cloudflare; o Nginx encaminha
# X-Forwarded-Proto=https. Forçar Secure garante o cookie correto mesmo com o
# salto interno em HTTP dentro da tailnet.
Environment="APP_COOKIE_SECURE=1"
