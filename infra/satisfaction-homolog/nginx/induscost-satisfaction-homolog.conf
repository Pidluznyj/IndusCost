# ─────────────────────────────────────────────────────────────────────────────
# IndusCost — gateway privado da Satisfação (HOMOLOGAÇÃO)
#
# Destino no servidor-01:
#   /etc/nginx/sites-available/induscost-satisfaction-homolog
#   symlink em /etc/nginx/sites-enabled/induscost-satisfaction-homolog
#
# NÃO altere induscost-collector-homolog nem induscost-prod-gateway.
#
# Caminho completo:
#   Internet → Cloudflare → satisfacao-homolog.grupolazarios.com.br
#            → Cloudflare Tunnel (AWS) → Tailscale
#            → ESTE listener (100.64.174.124:8443)
#            → 127.0.0.1:3001 (IndusCost homologação)
#            → Public Host Guard do Node
#
# Este listener é a PRIMEIRA barreira aplicacional. O guard do Node é a segunda.
# Nenhuma porta é aberta para a Internet: o listener só existe no endereço
# Tailscale e só aceita a AWS.
# ─────────────────────────────────────────────────────────────────────────────

server {
    # Escuta APENAS no IP Tailscale do servidor-01, nunca em 0.0.0.0.
    # A 443 já pertence ao Collector — por isso a porta dedicada.
    listen 100.64.174.124:8443;

    server_name satisfacao-homolog.grupolazarios.com.br;

    # ── Origem: só o nó Tailscale da AWS que roda o cloudflared ──────────────
    # Não liberamos 100.64.0.0/10 inteiro nem a LAN.
    allow 100.85.97.124;
    deny all;

    # TLS termina na borda do Cloudflare. Entre AWS e servidor-01 o tráfego
    # trafega exclusivamente dentro da tailnet (já criptografada), por isso
    # este listener é HTTP puro.

    # Corpo pequeno por contrato: o formulário público envia poucos KB.
    client_max_body_size 128k;

    # Nada aqui deve ser indexado, cacheado ou vazar referer.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP compatível com o frontend público atual (React + CSS próprio).
    # Turnstile está DESABILITADO em homologação, então NÃO liberamos
    # challenges.cloudflare.com aqui — quando produção ligar o Turnstile,
    # acrescente-o em script-src e frame-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # ── Bloco de proxy compartilhado ────────────────────────────────────────
    # O header dedicado é SEMPRE sobrescrito aqui: o cliente não consegue
    # forjá-lo para se declarar (ou deixar de ser) superfície pública.
    # O guard do Node também decide pelo Host, então há dupla checagem.

    location = /r {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host satisfacao-homolog.grupolazarios.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-IndusCost-Satisfaction-Public 1;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host satisfacao-homolog.grupolazarios.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-IndusCost-Satisfaction-Public 1;
        # Assets do build têm hash no nome — cache longo é seguro e desejável.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host satisfacao-homolog.grupolazarios.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-IndusCost-Satisfaction-Public 1;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host satisfacao-homolog.grupolazarios.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-IndusCost-Satisfaction-Public 1;
    }

    # ── API pública: os QUATRO endpoints, nominalmente ──────────────────────
    # Deliberadamente NÃO usamos "^~ /api/public/satisfaction/" genérico:
    # listar um a um impede que um endpoint público futuro seja exposto em
    # homologação sem revisão explícita desta allowlist.

    location = /api/public/satisfaction/session {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host satisfacao-homolog.grupolazarios.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-IndusCost-Satisfaction-Public 1;
        add_header Cache-Control "no-store" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /api/public/satisfaction/form {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host satisfacao-homolog.grupolazarios.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-IndusCost-Satisfaction-Public 1;
        add_header Cache-Control "no-store" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /api/public/satisfaction/draft {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host satisfacao-homolog.grupolazarios.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-IndusCost-Satisfaction-Public 1;
        add_header Cache-Control "no-store" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /api/public/satisfaction/submit {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host satisfacao-homolog.grupolazarios.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-IndusCost-Satisfaction-Public 1;
        add_header Cache-Control "no-store" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── Tudo o mais não existe ──────────────────────────────────────────────
    # Fail-closed: 404 (e não 403) para não confirmar a aplicação interna.
    # Nada de proxy genérico em "/" ou "/api".
    location / {
        return 404;
    }
}
