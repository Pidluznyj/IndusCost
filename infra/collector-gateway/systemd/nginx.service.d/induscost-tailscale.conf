# ─────────────────────────────────────────────────────────────────────────────
# IndusCost — drop-in do nginx.service: só subir depois que o Tailscale
# entregar o IP em que o gateway do Collector faz bind.
#
# Destino no host: /etc/systemd/system/nginx.service.d/induscost-tailscale.conf
# Instalado por scripts/install-collector-gateway.sh. O unit original do pacote
# Ubuntu (/usr/lib/systemd/system/nginx.service) NÃO é alterado nem substituído:
# este arquivo só ACRESCENTA diretivas. Nenhuma linha "Chave=" vazia (que
# apagaria a lista original) é usada.
#
# Problema que resolve (visto em produção após reboot da AWS):
#   nginx: [emerg] bind() to 100.x.x.x:443 failed (99: Cannot assign requested address)
#   → nginx.service failed; tailscaled subiu depois; nginx nunca voltou sozinho.
#
# Como resolve:
#   1. ordenação: nginx só inicia depois de network-online e tailscaled;
#   2. espera real: ExecStartPre roda wait-for-tailscale.sh, que só devolve 0
#      quando o IP esperado está no kernel (timeout finito);
#   3. recuperação: se ainda assim o start falhar, systemd tenta de novo.
#
# Ordem efetiva no boot (systemctl cat nginx mostra o pacote + este drop-in):
#   ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'   ← do pacote, mantido; não faz bind
#   ExecStartPre=/usr/local/lib/induscost/wait-for-tailscale.sh            ← acrescentado aqui
#   ExecStart=/usr/sbin/nginx -g 'daemon on; master_process on;'            ← do pacote, intocado
# EnvironmentFile vale para TODOS os Exec*, incluindo os ExecStartPre.
# ─────────────────────────────────────────────────────────────────────────────

[Unit]
Wants=network-online.target tailscaled.service
After=network-online.target tailscaled.service

# systemd >= 230 (Ubuntu 24.04 tem 255): StartLimit* pertence à seção [Unit].
# Permite várias tentativas no boot sem cair no limite padrão (5 em 10 s).
# Com RestartSec=10 e espera de até 120 s, 10 tentativas em 30 min cobrem um
# Tailscale muito lento sem loop infinito.
StartLimitIntervalSec=1800
StartLimitBurst=10

[Service]
# COLLECTOR_TAILSCALE_IP e COLLECTOR_TAILSCALE_WAIT_TIMEOUT vêm do arquivo
# gravado pelo instalador (cópia do infra/collector-gateway/env/<ambiente>.env).
# O "-" evita que a ausência do arquivo derrube o unit; nesse caso o wait sai
# com 2 e o motivo fica no journal.
EnvironmentFile=-/etc/induscost/collector-gateway.env

# Espera o IP Tailscale antes do bind. Sai != 0 (e o start falha com motivo no
# journal) se o prazo COLLECTOR_TAILSCALE_WAIT_TIMEOUT expirar.
ExecStartPre=/usr/local/lib/induscost/wait-for-tailscale.sh

# nginx.service é Type=forking: o start só "conclui" quando o master forka.
# O prazo precisa cobrir a espera acima (120 s) + o próprio start.
TimeoutStartSec=180

# Recuperação automática se o bind falhar por um instante (IP ainda ausente).
# Com Type=forking, a falha do processo inicial (exit != 0) conta como falha
# de start e dispara o Restart normalmente.
Restart=on-failure
RestartSec=10
